<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantopia - Order Page</title>
    <style>
        :root {
            --primary-color: #2c5e3b;
            --bg-color: #f4f7f5;
            --text-color: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navbar / Header Styling */
        header {
            padding: 20px 9%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgb(24, 116, 24);
            width: 100%;
        }

        .logo {
            font-size: 30px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-weight: 600;
            color: white;
            text-decoration: none;
        }

        .navbar ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        .navbar li {
            display: inline-block;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .navbar a:hover {
            color: #d1e0d7;
        }

        /* Form Container Alignment */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .form-container {
            background: #ffffff;
            max-width: 550px;
            width: 100%;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border-top: 8px solid var(--primary-color);
        }

        h2 {
            color: var(--primary-color);
            margin-top: 0;
            text-align: center;
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }

        fieldset {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            background-color: #fafdfb;
        }

        legend {
            font-weight: bold;
            color: var(--primary-color);
            padding: 0 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"], input[type="tel"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed #eee;
        }

        .product-qty {
            width: 60px;
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
            text-align: center;
        }

        .radio-group {
            display: flex;
            gap: 15px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            width: 100%;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #2aa24c;
        }

        /* Footer Styling */
        .site-footer {
            background-color: #1e3525;
            color: #ffffff;
            padding: 30px 20px;
            text-align: center;
            width: 100%;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
        }

        .footer-logo {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #8fbc8f;
        }

        .footer-text {
            font-size: 14px;
            color: #d1e0d7;
            margin-bottom: 20px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .social-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            background-color: rgba(255, 255, 255, 0.1);
            text-decoration: none;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        /* SVG Color Fix */
        .social-icon svg {
            fill: #2aa24c;
            transition: transform 0.3s ease;
            color: white;
        }

        /* Hover Effects */
        .social-icon.facebook:hover { background-color: #dce2ea; transform: translateY(-5px); }
        .social-icon.twitter:hover { background-color: #f0e8e8; transform: translateY(-5px); }
        

        .footer-bottom {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
            font-size: 13px;
            color: #a3bdae;
        }
    </style>
</head>
<body>

    <!-- 1. Header / Navbar Section -->
    <header>
        <a href="#" class="logo">FloraFusion</a>
        <nav class="navbar">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="About us.html">About us</a></li>
                <li> <a href="services.html">services</a></li>
                <li><a href="Gallery.html">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- 2. Main Content Section (Form) -->
    <main class="main-content">
        <div class="form-container">
            <h2>For Order</h2>
            <p class="subtitle">Fill this to place your order</p>

            <form id="orderForm" onsubmit="sendToWhatsApp(event)">
                
                <fieldset>
                    <legend>Customer Information</legend>
                    <div class="form-group">
                        <label for="Name">Full Name *</label>
                        <input type="text" id="Name" required placeholder="Enter your name">
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" required placeholder="03xx-xxxxxxx">
                    </div>
                    <div class="form-group">
                        <label for="address">Delivery Address *</label>
                        <textarea id="address" rows="3" required placeholder="enter address"></textarea>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Select Products</legend>
                    <div class="product-item">
                        <span>Hair Oil</span>
                        <input type="number" id="qty_oil" class="product-qty" min="0" value="0">
                    </div>
                    <div class="product-item">
                        <span>Hair Serum</span>
                        <input type="number" id="qty_serum" class="product-qty" min="0" value="0">
                    </div>
                    <div class="product-item">
                        <span>Handmade Soap</span>
                        <input type="number" id="qty_soap" class="product-qty" min="0" value="0">
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Payment Method</legend>
                    <div class="radio-group">
                        <label><input type="radio" name="payment" value="Cash on Delivery" checked> Cash on Delivery</label>
                        <label><input type="radio" name="payment" value="EasyPaisa/JazzCash"> EasyPaisa / JazzCash</label>
                    </div>
                </fieldset>

                <button type="submit">Place Order via WhatsApp 🛒</button>
            </form>
        </div>
    </main>

        <div class="footer-content">
            <div class="footer-logo">🌿 <b>FloraFusion</b></div>
            <p class="footer-text">Pure and natural hair care & skincare products crafted with love.</p>
